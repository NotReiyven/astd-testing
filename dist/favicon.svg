<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b4e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c0d12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tradeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#3A2D5C" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Glowing Aura behind Star -->
  <circle cx="256" cy="256" r="160" fill="#FFB300" opacity="0.18" filter="url(#glow)"/>

  <!-- Golden 5-Point All-Star Outer Silhouette -->
  <!-- Coordinates centered at (256, 256), outer radius ~190, inner radius ~82 -->
  <g filter="url(#shadow)">
    <polygon points="
      256,66 
      299,190 
      432,192 
      325,272 
      365,398 
      256,322 
      147,398 
      187,272 
      80,192 
      213,190" 
      fill="url(#starGold)" 
      stroke="#FFF9A6" 
      stroke-width="6" 
      stroke-linejoin="round"/>

    <!-- 3D Star Facets -->
    <!-- Top-left facet -->
    <polygon points="256,66 256,256 213,190" fill="url(#facetHighlight)"/>
    <!-- Top-right facet -->
    <polygon points="256,66 256,256 299,190" fill="#FFA000" opacity="0.4"/>
    <!-- Right outer facet -->
    <polygon points="432,192 256,256 325,272" fill="#E65100" opacity="0.5"/>
    <!-- Bottom-right facet -->
    <polygon points="365,398 256,256 256,322" fill="#BF360C" opacity="0.6"/>
    <!-- Bottom-left facet -->
    <polygon points="147,398 256,256 256,322" fill="url(#facetHighlight)" opacity="0.5"/>
    <!-- Left outer facet -->
    <polygon points="80,192 256,256 187,272" fill="url(#facetHighlight)" opacity="0.7"/>
  </g>

  <!-- Central Trade Analytics Diamond Crest -->
  <g filter="url(#glow)">
    <!-- Up/Down Exchange Rhombus (Market Valuation Core) -->
    <polygon points="256,160 326,256 256,352 186,256" fill="#0c0d14" stroke="url(#tradeCyan)" stroke-width="8"/>
    
    <!-- Upward Trend Arrow (Trading Bull / Profit) -->
    <path d="M 232,270 L 256,236 L 280,270" fill="none" stroke="#00F5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Trade Core Pip -->
    <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
  </g>
</svg>
