<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Added maximum-scale and user-scalable to prevent iOS input zoom-in bugs on touch devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ASTD Value List Website</title>
    <meta name="description" content="Calculate and analyze Roblox item trades with real-time value comparisons, demand insights, and customizable unit management for savvy traders." />

    <!-- Anti-Flashbang & Density Script: Runs BEFORE the DOM paints to prevent layout shifts -->
    <script>
      try {
        let theme = 'dark'; // Default
        let density = 'default';
        const stored = localStorage.getItem('astd_layout_storage');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.state) {
            if (parsed.state.theme) theme = parsed.state.theme;
            if (parsed.state.globalCompactMode) density = 'compact';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (density === 'compact') {
          document.documentElement.setAttribute('data-density', density);
        }
      } catch (e) {
        console.error("Failed to load layout preference", e);
      }
    </script>

    <!-- Bypass Fandom/Wikia hotlink protection (403 Forbidden) -->
    <meta name="referrer" content="no-referrer" />

    <!-- Google tag (gtag.js) with Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2R3P9SZK74"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Default consent to 'denied' BEFORE loading config
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });

      gtag('js', new Date());
      gtag('config', 'G-2R3P9SZK74');
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Premium Technical Typography: Geist and Geist Mono (Vercel's Typefaces) -->
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Updated to use the CSS variable so the background matches the injected theme instantly -->
    <style>html, body { height: 100%; margin: 0; background-color: var(--background, #000000); } #root { height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
